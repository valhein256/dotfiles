# Dotfile symlinks — one "<source>  <target>" per line.
# The single source of truth for every symlink `make install` creates.
#
# <source>: repo-relative (e.g. zsh/zshrc), or absolute/~/$VAR for an external
#           file. Relative paths resolve against the repo root.
# <target>: where the symlink is created; ~ and $VARS are expanded.
# Blank lines and #-comments are ignored. Missing sources are skipped with a
# warning; an existing target (real file or old symlink) is replaced.

# Files
gitconfig             ~/.gitconfig
screenrc              ~/.screenrc
sshrc                 ~/.ssh/rc
zsh/zshrc             ~/.zshrc

# Directories
zsh/zplug             ~/.zplug
tmux                  ~/.tmux
tools                 ~/.tools

# tmux.conf lives inside the linked ~/.tmux dir; keep it after the tmux entry
# so the ~/.tmux symlink already exists when this line resolves.
~/.tmux/tmux.conf     ~/.tmux.conf

# Claude Code settings — claude/settings.json is gitignored (holds account
# values); track claude/settings.example instead. Claude writes settings in
# place, so /config edits flow back into the file.
claude/settings.json  ~/.claude/settings.json

# Claude Code personal layer — CLAUDE.md (personal standards), the profiles/
# voice system, and the personal skills. Team skills are NOT managed here;
# they arrive via the <TEAM_PLUGIN> plugin + its local clone. See
# claude/skills-README.md for the full layout and the standby-mirror model.
claude/CLAUDE.md                                ~/.claude/CLAUDE.md
claude/profiles/core.md                         ~/.claude/profiles/core.md
claude/profiles/docs.md                         ~/.claude/profiles/docs.md
claude/profiles/message.md                      ~/.claude/profiles/message.md
claude/profiles/reporting.md                    ~/.claude/profiles/reporting.md
claude/profiles/tickets-comments-pr.md         ~/.claude/profiles/tickets-comments-pr.md
claude/skills/communication/draft               ~/.claude/skills/draft
claude/skills/environment/python-uv-deps        ~/.claude/skills/python-uv-deps
claude/skills/environment/kubeconfig-refresh    ~/.claude/skills/kubeconfig-refresh
claude/skills/automation/weekly-report          ~/.claude/skills/weekly-report

# Core dotfiles — repo-relative <source>  ->  <target> in $HOME.
# Tracked: these are the standard, non-machine-specific links.

# Files
gitconfig          ~/.gitconfig
screenrc           ~/.screenrc
sshrc              ~/.ssh/rc
zsh/zshrc          ~/.zshrc

# Directories
zsh/zplug          ~/.zplug
tmux               ~/.tmux
tools              ~/.tools

# tmux.conf lives inside the tmux dir; the line above links ~/.tmux first,
# so this absolute source resolves through it. Keep it after the tmux entry.
~/.tmux/tmux.conf  ~/.tmux.conf
